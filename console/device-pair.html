<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#142338"><title>AI DEV · PC 연결</title><link rel="stylesheet" href="/devices.css"><script src="/game-style.js" defer></script><script src="/device-pair.js" defer></script><link rel="stylesheet" href="/pixel-theme.css"><link rel="stylesheet" href="/game-style.css"></head><body><main class="pair-main"><span class="device-eyebrow">AI DEV DIRECTOR / DEVICE LINK</span><h1>내 PC 회사에<br><span>연결하기.</span></h1><p class="device-intro">PC의 ‘기기 연결’ 화면에서 발급한 8자리 코드를 입력하세요. 외부에서 연결하려면 이 기기에서도 Tailscale이 켜져 있어야 합니다.</p><form id="pair-form" class="device-card"><label>이 기기의 이름<input id="pair-name" maxlength="40" placeholder="예: 집 아이패드" required autocomplete="off"></label><label>PC 연결 코드<input id="pair-code" inputmode="numeric" pattern="[0-9]{8}" maxlength="8" placeholder="8자리 숫자" autocomplete="one-time-code" required></label><button id="pair-submit" type="submit" class="device-primary">회사에 연결</button><p id="pair-error" class="device-error" role="alert" hidden></p></form><p class="device-note">기기 등록은 30일 유지됩니다. PC가 켜져 있고 실행 서버와 네트워크 연결이 유지되어야 합니다. 연결 후 브라우저 메뉴에서 홈 화면에 추가하면 별도 아이콘으로 열 수 있습니다.</p></main></body></html>
